name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to validate without publishing"
        required: true
        default: "v1.3.1"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Validate and package release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a stable version tag such as v1.3.2" >&2
            exit 1
          }

      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release version and master ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/master
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          version=$(sed -n 's/^version: "\([0-9][0-9.]*\)"$/\1/p' CITATION.cff)
          test "$RELEASE_TAG" = "v$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run automated tests
        run: ./run-tests.sh

      - name: Build the runnable JAR
        run: ./build-jar.sh

      - name: Generate checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          jar="github-analyzer-$VERSION.jar"
          test -f "$jar"
          mkdir -p dist
          cp "$jar" dist/
          (cd dist && sha256sum "$jar" > "$jar.sha256")

      - name: Save verified release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "github-analyzer-$VERSION.jar.sha256")
          gh release create "$RELEASE_TAG" \
            "dist/github-analyzer-$VERSION.jar" \
            "dist/github-analyzer-$VERSION.jar.sha256" \
            --verify-tag --generate-notes --latest \
            --title "GitHub Analyzer $RELEASE_TAG"
